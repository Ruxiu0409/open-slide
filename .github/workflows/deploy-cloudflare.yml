name: Deploy demo to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'apps/demo/**'
      - 'packages/core/**'
      - 'pnpm-lock.yaml'
      - '.github/workflows/deploy-cloudflare.yml'
  workflow_dispatch:

concurrency:
  group: deploy-cloudflare-${{ github.ref }}
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build core
        run: pnpm --filter @open-slide/core build

      - name: Build demo (產出 apps/demo/dist + _redirects)
        run: pnpm --filter demo build

      - name: Deploy to Cloudflare Pages
        # 沒設好 CLOUDFLARE_API_TOKEN secret 前先略過，避免首跑失敗。
        if: ${{ env.HAS_CF_TOKEN == 'true' }}
        env:
          HAS_CF_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}
        uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy apps/demo/dist --project-name=open-slide --branch=main
